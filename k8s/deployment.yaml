apiVersion: apps/v1
kind: Deployment
metadata:
  name: quota-approval
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quota-approval
  template:
    metadata:
      labels:
        app: quota-approval
    spec:
      containers:
        - name: quota-approval
          image: quota-approval:latest
          ports:
            - containerPort: 8000
          env:
            - name: AZURE_SUBSCRIPTION_ID
              valueFrom:
                secretKeyRef:
                  name: quota-secrets
                  key: AZURE_SUBSCRIPTION_ID
            - name: TEAMS_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: quota-secrets
                  key: TEAMS_WEBHOOK_URL
